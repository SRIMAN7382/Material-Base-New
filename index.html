<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Redirecting - Material Base</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
      color: white;
      text-align: center;
    }

    .glow-bg {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.1) 0%,
        transparent 60%
      );
      animation: bgMove 8s linear infinite;
      z-index: 0;
    }

    @keyframes bgMove {
      0% { transform: translate(0, 0); }
      50% { transform: translate(20px, 30px); }
      100% { transform: translate(0, 0); }
    }

    .content {
      z-index: 1;
      animation: fadeInZoom 1.5s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .logo {
      height: 90px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    p {
      font-size: 1.2rem;
      margin-top: 10px;
    }

    .loader {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 30px auto 0;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fallback {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.95rem;
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="glow-bg"></div>

  <div class="content">
    <img src="images/logok.png" alt="Material Base Logo" class="logo" />

    <h1>Redirecting You</h1>
    <p>Taking you to SASTRA Material Hub login...</p>

    <div class="loader"></div>

    <!-- ✅ Correct fallback link -->
    <a href="https://hub.sastra.edu/sastranet/materialhub" class="fallback">
      Click here if not redirected
    </a>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        window.location.replace("https://hub.sastra.edu/sastranet/materialhub");
      }, 3000);
    });
  </script>
</body>
</html>
