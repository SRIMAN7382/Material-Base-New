<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Redirecting - SASTRA Material Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100vh;
    background:#050510;
    display:flex;align-items:center;justify-content:center;
    font-family:'DM Sans',sans-serif;
    overflow:hidden;
    position:relative;
  }

  .aurora{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(99,57,247,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 10%, rgba(29,158,117,0.2) 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 50% 90%, rgba(216,90,48,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 90% 70%, rgba(99,57,247,0.2) 0%, transparent 50%);
    animation:auroraShift 12s ease-in-out infinite alternate;
  }
  @keyframes auroraShift{
    0%{opacity:0.8;transform:scale(1)}
    100%{opacity:1;transform:scale(1.05) translateY(-10px)}
  }

  .grid{
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }

  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    animation:orbFloat 8s ease-in-out infinite;
    pointer-events:none;
  }
  .orb1{width:400px;height:400px;background:rgba(99,57,247,0.25);top:-100px;left:-100px;animation-delay:0s}
  .orb2{width:300px;height:300px;background:rgba(29,158,117,0.18);bottom:-80px;right:-60px;animation-delay:-4s}
  .orb3{width:200px;height:200px;background:rgba(216,90,48,0.15);top:50%;left:60%;animation-delay:-2s}
  @keyframes orbFloat{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(20px,-30px) scale(1.1)}
  }

  .card{
    position:relative;z-index:10;
    width:460px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:28px;
    padding:52px 48px;
    text-align:center;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    box-shadow:
      0 0 0 1px rgba(99,57,247,0.15),
      0 40px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation:cardIn 1s cubic-bezier(0.22,1,0.36,1) forwards;
    opacity:0;transform:translateY(32px) scale(0.96);
  }
  @keyframes cardIn{
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(99,57,247,0.15);
    border:1px solid rgba(99,57,247,0.3);
    border-radius:100px;
    padding:5px 14px;
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
    color:rgba(180,155,255,0.9);
    margin-bottom:28px;
    animation:fadeUp 0.8s 0.3s ease forwards;opacity:0;transform:translateY(8px);
  }
  .badge-dot{
    width:6px;height:6px;border-radius:50%;
    background:#9b6dff;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:0.5;transform:scale(0.7)}
  }

  .icon-ring{
    width:80px;height:80px;
    border-radius:50%;
    background:linear-gradient(135deg,rgba(99,57,247,0.3),rgba(29,158,117,0.2));
    border:1px solid rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 28px;
    position:relative;
    animation:fadeUp 0.8s 0.4s ease forwards;opacity:0;transform:translateY(8px);
  }
  .icon-ring::before{
    content:'';position:absolute;inset:-6px;
    border-radius:50%;
    border:1px solid rgba(99,57,247,0.2);
    animation:ringPulse 3s ease-in-out infinite;
  }
  @keyframes ringPulse{
    0%,100%{transform:scale(1);opacity:0.6}
    50%{transform:scale(1.08);opacity:0.2}
  }
  .icon-ring svg{width:34px;height:34px}

  h1{
    font-family:'Syne',sans-serif;
    font-size:2rem;font-weight:800;
    color:#fff;line-height:1.2;
    margin-bottom:10px;
    animation:fadeUp 0.8s 0.5s ease forwards;opacity:0;transform:translateY(8px);
  }
  h1 span{
    background:linear-gradient(135deg,#9b6dff,#5dcaa5);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }

  .subtitle{
    font-size:0.95rem;color:rgba(255,255,255,0.45);
    line-height:1.6;margin-bottom:36px;
    animation:fadeUp 0.8s 0.6s ease forwards;opacity:0;transform:translateY(8px);
  }

  .progress-wrap{
    margin-bottom:28px;
    animation:fadeUp 0.8s 0.7s ease forwards;opacity:0;transform:translateY(8px);
  }
  .progress-label{
    display:flex;justify-content:space-between;
    font-size:11px;color:rgba(255,255,255,0.3);
    margin-bottom:8px;letter-spacing:0.04em;
  }
  .progress-bar-bg{
    height:3px;background:rgba(255,255,255,0.07);border-radius:100px;overflow:hidden;
  }
  .progress-bar{
    height:100%;width:0%;border-radius:100px;
    background:linear-gradient(90deg,#6339f7,#5dcaa5);
    transition:width 0.1s linear;
    box-shadow:0 0 8px rgba(99,57,247,0.6);
  }

  .timer-num{
    font-family:'Syne',sans-serif;
    font-size:3.5rem;font-weight:700;
    color:#fff;line-height:1;
    margin-bottom:4px;
    animation:fadeUp 0.8s 0.75s ease forwards;opacity:0;transform:translateY(8px);
  }
  .timer-label{
    font-size:0.8rem;color:rgba(255,255,255,0.3);
    letter-spacing:0.1em;text-transform:uppercase;
    margin-bottom:32px;
    animation:fadeUp 0.8s 0.8s ease forwards;opacity:0;transform:translateY(8px);
  }

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 28px;
    border-radius:14px;
    font-size:0.9rem;font-weight:500;
    text-decoration:none;
    cursor:pointer;
    transition:all 0.25s ease;
    animation:fadeUp 0.8s 0.9s ease forwards;opacity:0;transform:translateY(8px);
  }
  .btn-primary{
    background:linear-gradient(135deg,#6339f7,#5062f0);
    color:#fff;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 8px 24px rgba(99,57,247,0.4);
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(99,57,247,0.55);
  }
  .btn-ghost{
    background:rgba(255,255,255,0.05);
    color:rgba(255,255,255,0.5);
    border:1px solid rgba(255,255,255,0.08);
    margin-top:10px;font-size:0.82rem;
  }
  .btn-ghost:hover{
    color:rgba(255,255,255,0.8);
    background:rgba(255,255,255,0.08);
  }

  .divider{
    height:1px;background:rgba(255,255,255,0.06);
    margin:28px 0;
    animation:fadeUp 0.8s 0.85s ease forwards;opacity:0;
  }

  .destination{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:12px;
    margin-bottom:20px;
    animation:fadeUp 0.8s 0.88s ease forwards;opacity:0;transform:translateY(8px);
  }
  .destination-icon{
    width:32px;height:32px;border-radius:8px;
    background:rgba(29,158,117,0.15);
    border:1px solid rgba(29,158,117,0.25);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .destination-text{text-align:left;}
  .destination-text p{font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:2px;letter-spacing:0.04em;}
  .destination-text span{font-size:0.82rem;color:rgba(255,255,255,0.6);font-family:monospace}

  @keyframes fadeUp{
    to{opacity:1;transform:translateY(0)}
  }
</style>
</head>
<body>

<div class="aurora"></div>
<div class="grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="card">
  <div class="badge">
    <span class="badge-dot"></span>
    SASTRA University
  </div>

  <div class="icon-ring">
    <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 4L4 10V16C4 23.2 9.8 29.9 17 32C24.2 29.9 30 23.2 30 16V10L17 4Z"
        stroke="rgba(155,109,255,0.8)" stroke-width="1.5" stroke-linejoin="round"
        fill="rgba(99,57,247,0.15)"/>
      <path d="M12 17L15.5 20.5L22 14" stroke="#5dcaa5" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Redirecting <span>You Now</span></h1>
  <p class="subtitle">You're being securely transferred to SASTRA Material Hub. This only takes a moment.</p>

  <div class="destination">
    <div class="destination-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2L2 5V9C2 12.3 4.7 15.3 8 16C11.3 15.3 14 12.3 14 9V5L8 2Z"
          fill="rgba(29,158,117,0.5)" stroke="rgba(93,202,165,0.6)" stroke-width="1"/>
      </svg>
    </div>
    <div class="destination-text">
      <p>Destination</p>
      <span>hub.sastra.edu/sastranet/materialhub</span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Connecting</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>

  <div class="timer-num" id="countdown">3</div>
  <div class="timer-label">seconds remaining</div>

  <div class="divider"></div>

  <a href="https://hub.sastra.edu/sastranet/materialhub" class="btn btn-primary">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M2 7H12M12 7L8 3M12 7L8 11" stroke="white" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Go Now
  </a>
  <br/>
  <a href="https://hub.sastra.edu/sastranet/materialhub" target="_blank" class="btn btn-ghost">
    Open in new tab ↗
  </a>
</div>

<script>
  const total = 3000;
  const bar = document.getElementById('bar');
  const pct = document.getElementById('pct');
  const cd = document.getElementById('countdown');
  const start = Date.now();

  const tick = setInterval(function() {
    const elapsed = Date.now() - start;
    const progress = Math.min(elapsed / total * 100, 100);
    const remaining = Math.max(0, Math.ceil((total - elapsed) / 1000));
    bar.style.width = progress + '%';
    pct.textContent = Math.round(progress) + '%';
    cd.textContent = remaining;
    if (elapsed >= total) {
      clearInterval(tick);
      window.location.replace('https://hub.sastra.edu/sastranet/materialhub');
    }
  }, 50);
</script>

</body>
</html>
